[project]
name = "candidate-search"
version = "0.1.0"
description = "Cruzamento de dados públicos de políticos brasileiros, com fonte de confiabilidade em cada registro."
readme = "README.md"
authors = [{ name = "Renato Vieira" }]
requires-python = ">=3.12"
dependencies = [
    # curl_cffi impersona o handshake TLS do Chrome — sem isso o Akamai Bot Manager
    # do TSE (e provavelmente outras fontes) devolve 403 para clientes Python.
    "curl-cffi>=0.7",
]

[project.scripts]
candidate-search = "candidate_search.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["candidate_search"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
